<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bid Ledger — Capital Project Comparison</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

const PAPER = "#EDEAE1";
const PAPER_CARD = "#F6F4EE";
const INK = "#1F2B3D";
const INK_SOFT = "#5B6578";
const RULE = "#C8C2B4";
const GOLD = "#B8863B";
const GOLD_TINT = "#F1E7D3";
const CHECK_GREEN = "#3F6B4E";

// --- minimal inline icons (no external icon library needed) ---
const IconBase = ({ children, size = 14, ...rest }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...rest}>
    {children}
  </svg>
);
const Plus = (p) => <IconBase {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></IconBase>;
const X = (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
const Check = (p) => <IconBase {...p}><polyline points="20 6 9 17 4 12"/></IconBase>;
const RotateCcw = (p) => <IconBase {...p}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></IconBase>;
const ClipboardCopy = (p) => <IconBase {...p}><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3"/><path d="M13 13h6"/><path d="M13 17h6"/><path d="M16 10v10"/></IconBase>;
const Stamp = (p) => <IconBase {...p}><path d="M5 22h14"/><path d="M6 18h12"/><circle cx="12" cy="9" r="6"/><path d="M9 15h6l1 3H8l1-3z"/></IconBase>;
const Users = (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></IconBase>;

let idCounter = 1;
const nextId = () => `id-${idCounter++}`;

const startingItems = [
  { id: nextId(), label: "Labor" },
  { id: nextId(), label: "Materials" },
  { id: nextId(), label: "Permits & fees" },
  { id: nextId(), label: "Disposal / cleanup" },
  { id: nextId(), label: "Contingency" },
];

const startingBids = [
  {
    id: nextId(),
    vendor: "Northgate Roofing Co.",
    amounts: { [startingItems[0].id]: "8400", [startingItems[1].id]: "11200", [startingItems[2].id]: "650", [startingItems[3].id]: "900", [startingItems[4].id]: "1200" },
    warranty: "10",
    timeline: "3",
    notes: "Owner-operator, 14 yrs in business. Two references checked out.",
  },
  {
    id: nextId(),
    vendor: "Summit Exteriors",
    amounts: { [startingItems[0].id]: "9100", [startingItems[1].id]: "10400", [startingItems[2].id]: "500", [startingItems[3].id]: "750", [startingItems[4].id]: "1500" },
    warranty: "15",
    timeline: "2",
    notes: "Larger crew, faster turnaround. Slightly higher labor rate.",
  },
];

function money(n) {
  const v = parseFloat(n);
  if (isNaN(v)) return null;
  return v;
}

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 });
}

function BidLedger() {
  const [projectTitle, setProjectTitle] = useState("Roof Replacement — 33 W Elmhurst Ave");
  const [items, setItems] = useState(startingItems);
  const [bids, setBids] = useState(startingBids);
  const [copied, setCopied] = useState(false);
  const [board, setBoard] = useState([
    { id: nextId(), name: "", email: "", pick: "", note: "" },
    { id: nextId(), name: "", email: "", pick: "", note: "" },
  ]);
  const [respondBy, setRespondBy] = useState("");
  const [boardCopied, setBoardCopied] = useState(false);
  const taRef = useRef(null);
  const boardTaRef = useRef(null);

  const totals = bids.map((b) => {
    let sum = 0;
    let hasAny = false;
    items.forEach((it) => {
      const v = money(b.amounts[it.id]);
      if (v !== null) {
        sum += v;
        hasAny = true;
      }
    });
    return hasAny ? sum : null;
  });

  const validTotals = totals.filter((t) => t !== null);
  const lowestTotal = validTotals.length ? Math.min(...validTotals) : null;
  const lowestTotalIdx = lowestTotal !== null ? totals.indexOf(lowestTotal) : -1;

  const warrantyVals = bids.map((b) => (b.warranty === "" ? null : parseFloat(b.warranty)));
  const longestWarranty = warrantyVals.some((v) => v !== null) ? Math.max(...warrantyVals.filter((v) => v !== null)) : null;

  const timelineVals = bids.map((b) => (b.timeline === "" ? null : parseFloat(b.timeline)));
  const shortestTimeline = timelineVals.some((v) => v !== null) ? Math.min(...timelineVals.filter((v) => v !== null)) : null;

  function lowestForItem(itemId) {
    const vals = bids.map((b) => money(b.amounts[itemId]));
    const valid = vals.filter((v) => v !== null);
    if (!valid.length) return null;
    return Math.min(...valid);
  }

  function updateAmount(bidId, itemId, value) {
    setBids((bs) => bs.map((b) => (b.id === bidId ? { ...b, amounts: { ...b.amounts, [itemId]: value } } : b)));
  }

  function updateBidField(bidId, field, value) {
    setBids((bs) => bs.map((b) => (b.id === bidId ? { ...b, [field]: value } : b)));
  }

  function addItem() {
    setItems((its) => [...its, { id: nextId(), label: "" }]);
  }

  function removeItem(itemId) {
    setItems((its) => its.filter((it) => it.id !== itemId));
  }

  function updateItemLabel(itemId, label) {
    setItems((its) => its.map((it) => (it.id === itemId ? { ...it, label } : it)));
  }

  function addBid() {
    if (bids.length >= 5) return;
    setBids((bs) => [...bs, { id: nextId(), vendor: "", amounts: {}, warranty: "", timeline: "", notes: "" }]);
  }

  function removeBid(bidId) {
    setBids((bs) => bs.filter((b) => b.id !== bidId));
  }

  function buildSummary() {
    const lines = [];
    lines.push(projectTitle || "Bid Comparison");
    lines.push("");
    bids.forEach((b, i) => {
      lines.push(`${b.vendor || "(unnamed vendor)"}${i === lowestTotalIdx ? "  — lowest total" : ""}`);
      items.forEach((it) => {
        const v = money(b.amounts[it.id]);
        lines.push(`  ${it.label || "(item)"}: ${v !== null ? fmt(v) : "—"}`);
      });
      lines.push(`  Total: ${totals[i] !== null ? fmt(totals[i]) : "—"}`);
      lines.push(`  Warranty: ${b.warranty ? `${b.warranty} yrs` : "—"}   Timeline: ${b.timeline ? `${b.timeline} wks` : "—"}`);
      if (b.notes) lines.push(`  Notes: ${b.notes}`);
      lines.push("");
    });
    return lines.join("\n");
  }

  function copySummary() {
    const text = buildSummary();
    let copiedOk = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
      copiedOk = true;
    }
    if (taRef.current) {
      taRef.current.value = text;
      taRef.current.style.display = "block";
      taRef.current.focus();
      taRef.current.select();
    }
    if (copiedOk) {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }
  }

  function resetDemo() {
    idCounter = 1;
    setItems([
      { id: nextId(), label: "Labor" },
      { id: nextId(), label: "Materials" },
      { id: nextId(), label: "Permits & fees" },
    ]);
    setBids([
      { id: nextId(), vendor: "", amounts: {}, warranty: "", timeline: "", notes: "" },
      { id: nextId(), vendor: "", amounts: {}, warranty: "", timeline: "", notes: "" },
    ]);
    setProjectTitle("");
  }

  function addBoardMember() {
    setBoard((bm) => [...bm, { id: nextId(), name: "", email: "", pick: "", note: "" }]);
  }
  function removeBoardMember(id) {
    setBoard((bm) => bm.filter((m) => m.id !== id));
  }
  function updateBoardMember(id, field, value) {
    setBoard((bm) => bm.map((m) => (m.id === id ? { ...m, [field]: value } : m)));
  }

  const tally = bids.map((b) => ({
    bidId: b.id,
    vendor: b.vendor || "(unnamed vendor)",
    count: board.filter((m) => m.pick === b.id).length,
  }));
  const respondedCount = board.filter((m) => m.pick).length;
  const topTallyCount = tally.length ? Math.max(...tally.map((t) => t.count)) : 0;

  function buildCheckinMessage() {
    const lines = [];
    lines.push(`Board check-in: ${projectTitle || "Bid Comparison"}`);
    lines.push("");
    lines.push("This is an informal check-in to gather input before our next board meeting — not an official vote. Please reply with your preferred vendor and any concerns.");
    if (respondBy) lines.push(`Please reply by: ${respondBy}`);
    lines.push("");
    lines.push(buildSummary());
    return lines.join("\n");
  }

  function copyCheckinMessage() {
    const text = buildCheckinMessage();
    let copiedOk = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
      copiedOk = true;
    }
    if (boardTaRef.current) {
      boardTaRef.current.value = text;
      boardTaRef.current.style.display = "block";
      boardTaRef.current.focus();
      boardTaRef.current.select();
    }
    if (copiedOk) {
      setBoardCopied(true);
      setTimeout(() => setBoardCopied(false), 1800);
    }
  }

  function mailtoHref() {
    const recipients = board.map((m) => m.email).filter(Boolean).join(",");
    const subject = encodeURIComponent(`Board check-in: ${projectTitle || "Bid Comparison"}`);
    const body = encodeURIComponent(buildCheckinMessage());
    return `mailto:${recipients}?subject=${subject}&body=${body}`;
  }

  return (
    <div className="min-h-screen w-full p-4 sm:p-8 font-sans" style={{ background: PAPER, color: INK }}>
      <div className="max-w-5xl mx-auto">
        <div className="mb-6 pb-4" style={{ borderBottom: `2px solid ${INK}` }}>
          <div className="text-xs uppercase tracking-widest mb-2" style={{ color: INK_SOFT, letterSpacing: "0.15em" }}>
            Bid Ledger · Capital Project Comparison
          </div>
          <input
            value={projectTitle}
            onChange={(e) => setProjectTitle(e.target.value)}
            placeholder="Project name (e.g. Roof Replacement — 33 W Elmhurst Ave)"
            className="w-full bg-transparent outline-none font-serif text-2xl sm:text-3xl"
            style={{ color: INK }}
          />
        </div>

        <div className="flex flex-wrap gap-2 mb-3 items-center">
          <button onClick={addBid} disabled={bids.length >= 5}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium disabled:opacity-40"
            style={{ background: INK, color: PAPER_CARD }}>
            <Plus size={14} /> Add bid
          </button>
          <button onClick={addItem}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium border"
            style={{ borderColor: INK, color: INK }}>
            <Plus size={14} /> Add line item
          </button>
          <div className="flex-1" />
          <button onClick={copySummary}
            className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium border"
            style={{ borderColor: GOLD, color: GOLD }}>
            {copied ? <Check size={14} /> : <ClipboardCopy size={14} />}
            {copied ? "Copied" : "Copy summary"}
          </button>
          <button onClick={resetDemo}
            className="flex items-center gap-1.5 px-2 py-1.5 rounded text-sm"
            style={{ color: INK_SOFT }} title="Clear example data">
            <RotateCcw size={13} /> Clear
          </button>
        </div>

        <textarea ref={taRef} readOnly aria-label="Bid summary text"
          style={{ display: "none", width: "100%", height: 160, marginBottom: 12, fontFamily: "monospace", fontSize: 12, padding: 8, border: `1px solid ${RULE}`, background: PAPER_CARD, color: INK }} />
        <div className="text-xs mb-4" style={{ color: INK_SOFT }}>
          Copy summary fills the box above and selects the text — press Ctrl/Cmd+C to copy it.
        </div>

        <div className="overflow-x-auto rounded" style={{ background: PAPER_CARD, border: `1px solid ${RULE}` }}>
          <table className="w-full text-sm" style={{ borderCollapse: "collapse", minWidth: 560 }}>
            <thead>
              <tr>
                <th className="text-left p-3 font-sans font-medium" style={{ color: INK_SOFT, width: 160, borderBottom: `2px solid ${INK}` }}>
                  Line item
                </th>
                {bids.map((b, i) => (
                  <th key={b.id} className="p-3 text-left relative" style={{ borderBottom: `2px solid ${INK}`, borderLeft: `1px solid ${RULE}`, minWidth: 190 }}>
                    {i === lowestTotalIdx && lowestTotal !== null && (
                      <div className="absolute -top-3 right-2 flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold uppercase"
                        style={{ border: `1.5px dashed ${GOLD}`, color: GOLD, background: PAPER_CARD, transform: "rotate(-6deg)", letterSpacing: "0.08em" }}>
                        <Stamp size={10} /> Best value
                      </div>
                    )}
                    <div className="flex items-start justify-between gap-1">
                      <input value={b.vendor} onChange={(e) => updateBidField(b.id, "vendor", e.target.value)}
                        placeholder="Vendor name" className="bg-transparent outline-none font-serif text-base w-full" style={{ color: INK }} />
                      {bids.length > 1 && (
                        <button onClick={() => removeBid(b.id)} style={{ color: INK_SOFT }} className="mt-1">
                          <X size={13} />
                        </button>
                      )}
                    </div>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {items.map((it) => {
                const rowLowest = lowestForItem(it.id);
                return (
                  <tr key={it.id}>
                    <td className="p-3" style={{ borderTop: `1px solid ${RULE}` }}>
                      <div className="flex items-center gap-1">
                        <input value={it.label} onChange={(e) => updateItemLabel(it.id, e.target.value)}
                          placeholder="Item" className="bg-transparent outline-none text-sm w-full" style={{ color: INK }} />
                        <button onClick={() => removeItem(it.id)} style={{ color: RULE }}>
                          <X size={12} />
                        </button>
                      </div>
                    </td>
                    {bids.map((b) => {
                      const v = money(b.amounts[it.id]);
                      const isLowest = v !== null && rowLowest !== null && v === rowLowest;
                      return (
                        <td key={b.id} className="p-3" style={{ borderTop: `1px solid ${RULE}`, borderLeft: `1px solid ${RULE}` }}>
                          <div className="flex items-center gap-1.5">
                            <span style={{ color: INK_SOFT, fontFamily: "monospace" }}>$</span>
                            <input value={b.amounts[it.id] ?? ""} onChange={(e) => updateAmount(b.id, it.id, e.target.value)}
                              inputMode="decimal" placeholder="0" className="bg-transparent outline-none w-full"
                              style={{ color: isLowest ? CHECK_GREEN : INK, fontFamily: "monospace", fontWeight: isLowest ? 700 : 400 }} />
                            {isLowest && <Check size={12} style={{ color: CHECK_GREEN }} />}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                );
              })}

              <tr>
                <td className="p-3 font-serif font-semibold" style={{ borderTop: `2px solid ${INK}` }}>Total</td>
                {bids.map((b, i) => (
                  <td key={b.id} className="p-3" style={{ borderTop: `2px solid ${INK}`, borderLeft: `1px solid ${RULE}` }}>
                    <span className="font-serif font-bold text-base" style={{ color: i === lowestTotalIdx && lowestTotal !== null ? GOLD : INK, fontFamily: "monospace" }}>
                      {fmt(totals[i])}
                    </span>
                  </td>
                ))}
              </tr>

              <tr>
                <td className="p-3" style={{ borderTop: `1px solid ${RULE}`, color: INK_SOFT }}>Warranty (yrs)</td>
                {bids.map((b) => {
                  const v = b.warranty === "" ? null : parseFloat(b.warranty);
                  const isBest = v !== null && longestWarranty !== null && v === longestWarranty;
                  return (
                    <td key={b.id} className="p-3" style={{ borderTop: `1px solid ${RULE}`, borderLeft: `1px solid ${RULE}` }}>
                      <input value={b.warranty} onChange={(e) => updateBidField(b.id, "warranty", e.target.value)}
                        inputMode="decimal" placeholder="—" className="bg-transparent outline-none w-16"
                        style={{ color: isBest ? CHECK_GREEN : INK, fontFamily: "monospace", fontWeight: isBest ? 700 : 400 }} />
                    </td>
                  );
                })}
              </tr>

              <tr>
                <td className="p-3" style={{ borderTop: `1px solid ${RULE}`, color: INK_SOFT }}>Timeline (wks)</td>
                {bids.map((b) => {
                  const v = b.timeline === "" ? null : parseFloat(b.timeline);
                  const isBest = v !== null && shortestTimeline !== null && v === shortestTimeline;
                  return (
                    <td key={b.id} className="p-3" style={{ borderTop: `1px solid ${RULE}`, borderLeft: `1px solid ${RULE}` }}>
                      <input value={b.timeline} onChange={(e) => updateBidField(b.id, "timeline", e.target.value)}
                        inputMode="decimal" placeholder="—" className="bg-transparent outline-none w-16"
                        style={{ color: isBest ? CHECK_GREEN : INK, fontFamily: "monospace", fontWeight: isBest ? 700 : 400 }} />
                    </td>
                  );
                })}
              </tr>

              <tr>
                <td className="p-3 align-top" style={{ borderTop: `1px solid ${RULE}`, color: INK_SOFT }}>Notes</td>
                {bids.map((b) => (
                  <td key={b.id} className="p-3 align-top" style={{ borderTop: `1px solid ${RULE}`, borderLeft: `1px solid ${RULE}` }}>
                    <textarea value={b.notes} onChange={(e) => updateBidField(b.id, "notes", e.target.value)}
                      placeholder="References, red flags, insurance/license notes…" rows={2}
                      className="bg-transparent outline-none w-full text-xs resize-none" style={{ color: INK_SOFT }} />
                  </td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>

        <div className="mt-4 text-xs" style={{ color: INK_SOFT }}>
          Gold marks the lowest total bid. Green checks mark the lowest amount in each row. This compares dollars only — weigh warranty, timeline, and notes before deciding.
        </div>

        {/* Board Check-In */}
        <div className="mt-10 pt-6" style={{ borderTop: `2px solid ${INK}` }}>
          <div className="flex items-center gap-2 mb-1">
            <Users size={16} style={{ color: INK }} />
            <h2 className="font-serif text-lg font-semibold" style={{ color: INK }}>Board Check-In</h2>
          </div>
          <div className="flex items-start gap-1.5 mb-4 p-2.5 rounded text-xs" style={{ background: GOLD_TINT, color: INK }}>
            <Info size={14} style={{ color: GOLD, flexShrink: 0, marginTop: 2 }} />
            <span>
              This gathers informal input only — <strong>it is not an official vote.</strong> Board votes on
              contracts generally must happen at a properly noticed meeting (or a formal written-ballot process
              your bylaws and state law allow, with its own quorum and notice rules). Check your governing
              documents and state law before treating any reply here as binding.
            </span>
          </div>

          <div className="mb-4">
            <label className="block text-xs mb-1" style={{ color: INK_SOFT }}>Response requested by (optional)</label>
            <input type="date" value={respondBy} onChange={(e) => setRespondBy(e.target.value)}
              className="bg-transparent outline-none border rounded px-2 py-1 text-sm"
              style={{ borderColor: RULE, color: INK }} />
          </div>

          <div className="overflow-x-auto rounded mb-3" style={{ background: PAPER_CARD, border: `1px solid ${RULE}` }}>
            <table className="w-full text-sm" style={{ borderCollapse: "collapse", minWidth: 560 }}>
              <thead>
                <tr>
                  <th className="text-left p-2.5 font-sans font-medium text-xs" style={{ color: INK_SOFT, borderBottom: `2px solid ${INK}` }}>Board member</th>
                  <th className="text-left p-2.5 font-sans font-medium text-xs" style={{ color: INK_SOFT, borderBottom: `2px solid ${INK}` }}>Email</th>
                  <th className="text-left p-2.5 font-sans font-medium text-xs" style={{ color: INK_SOFT, borderBottom: `2px solid ${INK}` }}>Their pick</th>
                  <th className="text-left p-2.5 font-sans font-medium text-xs" style={{ color: INK_SOFT, borderBottom: `2px solid ${INK}` }}>Note</th>
                  <th style={{ borderBottom: `2px solid ${INK}`, width: 28 }}></th>
                </tr>
              </thead>
              <tbody>
                {board.map((m) => (
                  <tr key={m.id}>
                    <td className="p-2" style={{ borderTop: `1px solid ${RULE}` }}>
                      <input value={m.name} onChange={(e) => updateBoardMember(m.id, "name", e.target.value)}
                        placeholder="Name" className="bg-transparent outline-none w-full text-sm" style={{ color: INK }} />
                    </td>
                    <td className="p-2" style={{ borderTop: `1px solid ${RULE}` }}>
                      <input value={m.email} onChange={(e) => updateBoardMember(m.id, "email", e.target.value)}
                        placeholder="name@email.com" type="email" className="bg-transparent outline-none w-full text-sm" style={{ color: INK }} />
                    </td>
                    <td className="p-2" style={{ borderTop: `1px solid ${RULE}` }}>
                      <select value={m.pick} onChange={(e) => updateBoardMember(m.id, "pick", e.target.value)}
                        className="bg-transparent outline-none w-full text-sm" style={{ color: m.pick ? CHECK_GREEN : INK_SOFT }}>
                        <option value="">Awaiting reply</option>
                        {bids.map((b) => (
                          <option key={b.id} value={b.id}>{b.vendor || "(unnamed vendor)"}</option>
                        ))}
                      </select>
                    </td>
                    <td className="p-2" style={{ borderTop: `1px solid ${RULE}` }}>
                      <input value={m.note} onChange={(e) => updateBoardMember(m.id, "note", e.target.value)}
                        placeholder="Concerns, conditions…" className="bg-transparent outline-none w-full text-xs" style={{ color: INK_SOFT }} />
                    </td>
                    <td className="p-2 text-right" style={{ borderTop: `1px solid ${RULE}` }}>
                      <button onClick={() => removeBoardMember(m.id)} style={{ color: RULE }}>
                        <X size={13} />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="flex flex-wrap gap-2 mb-4 items-center">
            <button onClick={addBoardMember}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium border"
              style={{ borderColor: INK, color: INK }}>
              <Plus size={14} /> Add board member
            </button>
            <button onClick={copyCheckinMessage}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium border"
              style={{ borderColor: GOLD, color: GOLD }}>
              {boardCopied ? <Check size={14} /> : <ClipboardCopy size={14} />}
              {boardCopied ? "Copied" : "Copy check-in message"}
            </button>
            <a href={mailtoHref()}
              className="flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium"
              style={{ background: INK, color: PAPER_CARD, textDecoration: "none" }}>
              Open in email
            </a>
          </div>

          <textarea ref={boardTaRef} readOnly aria-label="Board check-in message text"
            style={{ display: "none", width: "100%", height: 180, marginBottom: 12, fontFamily: "monospace", fontSize: 12, padding: 8, border: `1px solid ${RULE}`, background: PAPER_CARD, color: INK }} />

          {board.length > 0 && (
            <div className="text-xs mb-4" style={{ color: INK_SOFT }}>
              {respondedCount} of {board.length} board member{board.length === 1 ? "" : "s"} have replied.
              {respondBy ? ` Responses requested by ${respondBy}.` : ""}
            </div>
          )}

          {respondedCount > 0 && (
            <div className="flex flex-wrap gap-2">
              {tally.filter((t) => t.count > 0).map((t) => (
                <div key={t.bidId} className="px-2.5 py-1 rounded-full text-xs font-medium"
                  style={{ border: `1px solid ${t.count === topTallyCount ? GOLD : RULE}`, color: t.count === topTallyCount ? GOLD : INK_SOFT }}>
                  {t.vendor}: {t.count} of {board.length}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BidLedger />);
</script>
</body>
</html>
