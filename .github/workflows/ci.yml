name: CI

# Runs on every push and PR so a regression is caught automatically instead
# of relying on someone remembering to run lint/test/build by hand before
# pushing. Verified locally that `next build` succeeds without real
# Supabase/Resend credentials present (no route does data fetching at
# build/static-generation time), so this needs no secrets.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
